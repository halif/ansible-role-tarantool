---
- name: Install prerequisites for APT
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - gnupg
      - ca-certificates
      - curl
    state: present

- name: Download Tarantool GPG key
  ansible.builtin.get_url:
    url: "https://download.tarantool.org/tarantool/release/{{ tarantool_release }}/gpgkey"
    dest: /usr/share/keyrings/tarantool.gpg
    mode: '0644'

- name: Add Tarantool APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/tarantool.gpg] https://download.tarantool.org/tarantool/release/{{ tarantool_release }}/ubuntu/ {{ ansible_distribution_release }} main"
    state: present
    filename: tarantool
