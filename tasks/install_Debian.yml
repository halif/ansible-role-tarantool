---
- name: Clear any existing apt locks (CI safeguard)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/lib/apt/lists/lock
    - /var/cache/apt/archives/lock
    - /var/lib/dpkg/lock
    - /var/lib/dpkg/lock-frontend

- name: Force IPv4 for APT to prevent CI hangs
  ansible.builtin.copy:
    content: "Acquire::ForceIPv4 \"true\";\n"
    dest: /etc/apt/apt.conf.d/99force-ipv4
    mode: '0644'

- name: Update apt cache and install prerequisites
  ansible.builtin.apt:
    name:
      - gnupg
      - ca-certificates
      - curl
    state: present
    update_cache: true
    force_apt_get: true

- name: Ensure keyrings directory exists
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: '0755'

# noqa command-instead-of-module
- name: Download Tarantool GPG key (force IPv4 to prevent CI hangs)
  ansible.builtin.command: curl -4 -s -S -L -o /usr/share/keyrings/tarantool.gpg https://download.tarantool.org/tarantool/release/{{ tarantool_release }}/gpgkey
  args:
    creates: /usr/share/keyrings/tarantool.gpg

- name: Add Tarantool APT repository file
  ansible.builtin.copy:
    content: "deb [signed-by=/usr/share/keyrings/tarantool.gpg] https://download.tarantool.org/tarantool/release/{{ tarantool_release }}/ubuntu/ {{ ansible_distribution_release }} main\n"
    dest: /etc/apt/sources.list.d/tarantool.list
    mode: '0644'
