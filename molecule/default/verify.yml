---
- name: Verify
  hosts: instance
  become: true
  tasks:
    - name: Check if tarantool is installed
      ansible.builtin.command: tarantool --version
      register: tarantool_version
      changed_when: false

    - name: Assert tarantool is installed
      ansible.builtin.assert:
        that:
          - tarantool_version.rc == 0
        fail_msg: "Tarantool is not installed or not in PATH"
        success_msg: "Tarantool installed: {{ tarantool_version.stdout }}"

    - name: Check if tt CLI is installed
      ansible.builtin.command: tt --version
      register: tt_version
      changed_when: false

    - name: Assert tt is installed
      ansible.builtin.assert:
        that:
          - tt_version.rc == 0
        fail_msg: "tt CLI is not installed or not in PATH"
        success_msg: "tt CLI installed: {{ tt_version.stdout }}"

    - name: Check if systemd instance is active
      ansible.builtin.systemd:
        name: tarantool@test_instance
      register: instance_status

    - name: Assert instance is running
      ansible.builtin.assert:
        that:
          - instance_status.status.ActiveState == "active"
        fail_msg: "Tarantool instance test_instance is not active"
