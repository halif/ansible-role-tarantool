---
dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: instance
    image: ${MOLECULE_DISTRO:-geerlingguy/docker-ubuntu2204-ansible:latest}
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    # Убрали command: "/lib/systemd/systemd".
    # Образ Geerlingguy сам знает, как оставаться активным для Ansible.

provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
  # Явная последовательность убирает варнинги о missing playbooks
  playbooks:
    test:
      - dependency
      - destroy
      - syntax
      - create
      - converge
      - idempotence
      - verify
      - destroy

verifier:
  name: ansible
