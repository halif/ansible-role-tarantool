---
- name: Prepare Molecule instance
  hosts: instance
  gather_facts: false
  become: true

  tasks:
    - name: Install Python 3.11 on openSUSE Leap
      ansible.builtin.raw: |
        set -eu

        if [ ! -x /usr/bin/python3.11 ]; then
          zypper --non-interactive refresh
          zypper --non-interactive install python311
          echo "__PYTHON311_INSTALLED__"
        fi

        /usr/bin/python3.11 --version
      register: python311_install
      changed_when: "'__PYTHON311_INSTALLED__' in python311_install.stdout"
      when: "'opensuse' in (lookup('env', 'MOLECULE_DISTRO') | lower)"
