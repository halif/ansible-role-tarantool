---
- name: Converge
  hosts: instance
  become: true

  vars:
    ansible_python_interpreter: >-
      {{ '/usr/bin/python3.11'
         if 'opensuse' in lookup('env', 'MOLECULE_DISTRO')
         else 'auto_silent' }}

    tarantool_instances:
      - name: test_instance
        enabled: true
        port: 3301

  roles:
    - role: tarantool
